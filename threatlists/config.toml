# Configuração do gerador de listas (threatlists/build.py). Caminhos relativos à raiz do repositório.

[policy]
min_prefix_v4 = 16              # redes IPv4 mais largas que /16 são recusadas (quase sempre um erro do feed)
inbox_default_ttl_days = 30     # validade de uma entrada do inbox sem "# expires:"
inbox_default_class = "block"   # nível de uma entrada do inbox sem "# class:" (block | monitor)

[breaker]                       # circuit breaker: protege os firewalls de uma atualização anómala
min_previous = 50               # só se aplica a listas que já tinham pelo menos isto
max_change_pct = 50             # variação acima disto bloqueia a publicação dessa lista e faz o job falhar

[limits]                        # teto por lista (entradas). A confirmar por modelo na documentação do FortiOS.
"ip-block.txt" = 30000
"ip-monitor.txt" = 60000
"domain-block.txt" = 50000
"domain-monitor.txt" = 100000
"hash-md5.txt" = 100000
"hash-sha1.txt" = 100000
"hash-sha256.txt" = 100000

[allowlist]
files = ["threatlists/allowlist.txt"]
# Listas já existentes no repositório, só LIDAS (nunca alteradas): o que aí está nunca deve ser bloqueado.
external = ["IP_Exceptions", "Microsoft_IPs", "google-crawlers.txt"]

# ── Fontes ────────────────────────────────────────────────────────────────────────
# status = "verified": licença confirmada, entra nas listas publicadas.
# status = "pending":  licença por confirmar. NÃO publica (o repositório é público); só entra com --allow-pending, em testes locais.
# confidence = "high": bloqueia sozinha. "normal"/"low": só bloqueia se 2+ fontes concordarem (senão fica em monitor).

