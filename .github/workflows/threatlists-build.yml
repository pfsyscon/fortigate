# Gera as listas em threatlists/feeds/ a partir das fontes registadas em threatlists/config.toml e do inbox.
# Só escreve dentro de threatlists/ (nunca toca nas listas da raiz nem no workflow update-google-crawlers.yml).
name: Threatlists build

on:
  schedule:
    - cron: "20 */6 * * *"          # de 6 em 6 h, desfasado do update-google-crawlers (minuto 0)
  push:
    branches: [main]
    paths:                          # reconstrói quando alguém altera o inbox, a allowlist ou a configuração
      - "threatlists/inbox/**"
      - "threatlists/allowlist.txt"
      - "threatlists/config.toml"
  workflow_dispatch:
    inputs:
      inject_text:
        description: "Injetar IOCs (IPs/domínios/hashes; aceita hxxp e [.]). Vazio = só reconstruir."
        required: false
        default: ""
      inject_origin:
        description: "Origem (ex.: CNCS)"
        required: false
        default: "CNCS"
      inject_ref:
        description: "Referência do aviso (ex.: CNCS-2026-123)"
        required: false
        default: ""
      inject_days:
        description: "Validade em dias (1-365)"
        required: false
        default: "30"
      inject_class:
        description: "block ou monitor"
        required: false
        default: "block"
        type: choice
        options: [block, monitor]

permissions:
  contents: write

concurrency:
  group: threatlists
  cancel-in-progress: false         # nunca interromper uma escrita a meio

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes (offline)
        run: python -m unittest discover -s threatlists/tests

      - name: Injetar IOCs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_text != '' }}
        env:                         # os valores vão por variáveis de ambiente, nunca interpolados no script
          IOC_TEXT: ${{ inputs.inject_text }}
          ORIGIN: ${{ inputs.inject_origin }}
          REF: ${{ inputs.inject_ref }}
          DAYS: ${{ inputs.inject_days }}
          CLASS: ${{ inputs.inject_class }}
        run: python threatlists/inject.py --origin "$ORIGIN" --ref "$REF" --days "$DAYS" --class "$CLASS"

      - name: Gerar listas
        id: build
        run: |
          set +e
          python threatlists/build.py --prune
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Commit e push (só se algo mudou)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add threatlists/feeds threatlists/reports threatlists/inbox
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "threatlists: atualizar listas"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 10))
          done
          echo "Não foi possível fazer push" >&2
          exit 1

      - name: Falhar se o circuit breaker disparou
        if: ${{ steps.build.outputs.rc != '0' }}
        run: |
          echo "::error::Circuit breaker: pelo menos uma lista foi bloqueada (ver threatlists/reports/latest.md)."
          exit 1
